server:
  port: 8081

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: mall-user-service
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
  datasource:
    url: ${MALL_DB_URL:jdbc:mysql://localhost:3306/mall?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai}
    username: ${MALL_DB_USERNAME:mall_app}
    password: ${MALL_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 6
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.hyf.malluserservice.entity
  configuration:
    map-underscore-to-camel-case: true

# 用户域自定义配置
mall:
  jwt:
    secret: ${MALL_JWT_SECRET:}
  security:
    enabled: true
    exclude-paths:
      - /user/health
      - /user/avatar/upload
      - /error

# 阿里云 OSS 配置（头像上传）
alioss:
  endpoint: oss-cn-beijing.aliyuncs.com
  access-key-id: ${ALIOSS_ACCESS_KEY_ID:}
  access-key-secret: ${ALIOSS_ACCESS_KEY_SECRET:}
  bucket-name: skyhyf
