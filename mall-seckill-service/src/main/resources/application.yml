server:
  port: 8089

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: mall-seckill-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        register-enabled: ${NACOS_REGISTER_ENABLED:true}
        fail-fast: ${NACOS_FAIL_FAST:false}
  datasource:
    url: ${MALL_DB_URL:jdbc:mysql://localhost:3306/mall?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    username: ${MALL_DB_USERNAME:mall_app}
    password: ${MALL_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 秒杀入口的 DB 访问已收敛为「仅胜者落库」，但异步建单消费端仍会并发写订单；
      # 默认 10 连接在高并发下是硬瓶颈，这里放宽到 50。
      maximum-pool-size: 50
      minimum-idle: 10
      pool-name: SeckillHikariCP
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password:
      database: 1
      timeout: 3000ms
  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBITMQ_USERNAME:mall_app}
    password: ${RABBITMQ_PASSWORD:}
    virtual-host: /mall
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        # 并发消费 + 高 prefetch：让异步建单能跟上持续高 QPS，避免单线程逐条消费成为新瓶颈。
        prefetch: 50
        concurrency: 5
        max-concurrency: 10

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.hyf.mallseckillservice.entity
  configuration:
    map-underscore-to-camel-case: true

mall:
  jwt:
    secret: ${MALL_JWT_SECRET:}
  security:
    enabled: true
    exclude-paths:
      - /internal/**

seckill:
  rabbitmq:
    management-url: ${RABBITMQ_MANAGEMENT_URL:http://localhost:15672}
    management-username: ${RABBITMQ_MANAGEMENT_USERNAME:admin}
    management-password: ${RABBITMQ_MANAGEMENT_PASSWORD:123456}
  consumer:
    scale:
      up-backlog: ${SECKILL_SCALE_UP_BACKLOG:500}
      down-backlog: ${SECKILL_SCALE_DOWN_BACKLOG:50}
