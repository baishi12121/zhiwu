server:
  port: 8083

spring:
  application:
    name: mall-coupon-service
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
    sentinel:
      transport:
        dashboard: localhost:8858
        port: 8719
  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: 123456
    virtual-host: /mall
    # 压测优化配置
    connection-timeout: 10000
    requested-heartbeat: 30
    listener:
      simple:
        # 并发消费者配置（压测关键）
        concurrency: 10
        max-concurrency: 50
        # 每次从队列拉取的消息数
        prefetch-count: 50
        # 自动确认模式（生产建议手动确认）
        acknowledge-mode: auto
        # 重试配置
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms
          max-interval: 10000ms
          multiplier: 2.0
        # 默认队列和交换机自动创建
        default-requeue-rejected: true
    # 连接工厂缓存配置（CHANNEL 模式只缓存 channel，不缓存 connection）
    cache:
      channel:
        size: 50
        checkout-timeout: 10000
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password:
      database: 1
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 20 #连接池中最多能同时存在的连接数
          max-idle: 10 #连接池中最多允许保持的空闲连接数。
          min-idle: 5 #连接池最少要维护的空闲连接数。
          max-wait: 3000ms #当连接池没有空闲连接，且当前活跃连接数已达到 max-active 时，新请求最多等待多长时间去获取连接。
  datasource:
    url: jdbc:mysql://localhost:3306/mall?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.hyf.mallcouponservice.entity
  configuration:
    map-underscore-to-camel-case: true

