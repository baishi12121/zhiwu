server:
  port: 8084

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: mall-product-service
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
  datasource:
    url: ${MALL_DB_URL:jdbc:mysql://localhost:3306/mall?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai}
    username: ${MALL_DB_USERNAME:mall_app}
    password: ${MALL_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password:
      database: 6
      timeout: 3000ms
  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBITMQ_USERNAME:mall_app}
    password: ${RABBITMQ_PASSWORD:}
    virtual-host: /mall
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.hyf.mallproductservice.dataobject
  configuration:
    map-underscore-to-camel-case: true

alioss:
  endpoint: ${ALIOSS_ENDPOINT:oss-cn-beijing.aliyuncs.com}
  access-key-id: ${ALIOSS_ACCESS_KEY_ID:}
  access-key-secret: ${ALIOSS_ACCESS_KEY_SECRET:}
  bucket-name: ${ALIOSS_BUCKET_NAME:skyhyf}
